version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "test"
    ignore:
      # eslint 10 conflicts with eslint-config-next@15.5.4's peer range
      # (^7.23.0 || ^8.0.0 || ^9.0.0) and breaks `npm install` on Vercel.
      # Remove this once eslint-config-next supports eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
